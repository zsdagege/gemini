name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Syntax and type checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Deno entry point
        run: deno check --node-modules-dir=auto src/deno_index.ts

      - name: Check API proxy worker syntax
        run: node --check src/api_proxy/worker.mjs

      - name: Check JavaScript worker syntax
        run: node --input-type=module --check < src/index.js
